plugins { id 'com.android.application' }

android {
    namespace 'com.reylumi.android'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        // Proposed identity: owner must confirm before the first Play upload.
        applicationId 'com.reylumi.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'boolean', 'QA_LOCAL', 'false'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('REYLUMI_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('REYLUMI_ANDROID_KEYSTORE'))
                storePassword System.getenv('REYLUMI_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('REYLUMI_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('REYLUMI_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        qa {
            initWith debug
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            buildConfigField 'boolean', 'QA_LOCAL', 'true'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}

// Never accidentally deliver an unsigned store candidate as a signed release.
def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        ['REYLUMI_ANDROID_KEYSTORE', 'REYLUMI_ANDROID_STORE_PASSWORD',
         'REYLUMI_ANDROID_KEY_ALIAS', 'REYLUMI_ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Missing release signing variable: ${it}")
        }
        if (!file(System.getenv('REYLUMI_ANDROID_KEYSTORE')).isFile()) {
            throw new GradleException('Release keystore file does not exist')
        }
    }
}
tasks.configureEach {
    if (name in ['preReleaseBuild', 'bundleRelease', 'assembleRelease']) {
        dependsOn verifyReleaseSigning
    }
}
