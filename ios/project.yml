name: Reylumi
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: WJ4VQ4529Z
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Reylumi:
    type: application
    platform: iOS
    sources:
      - path: Reylumi
        excludes: [Info.plist, Info-Debug.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reylumi.ios
        INFOPLIST_FILE: Reylumi/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          INFOPLIST_FILE: Reylumi/Info-Debug.plist
  ReylumiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReylumiTests
        excludes: [Simulator.entitlements]
    dependencies:
      - target: Reylumi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reylumi.ios.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Reylumi:
    build:
      targets:
        Reylumi: all
    test:
      targets: [ReylumiTests]
