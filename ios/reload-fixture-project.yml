name: ReloadFixture
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ReloadFixture:
    type: application
    platform: iOS
    sources:
      - path: ReloadFixtureApp
      - path: Reylumi/AppViewport.js
        buildPhase: resources
      - path: Reylumi/NativeBridge.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reylumi.reloadfixture
        INFOPLIST_FILE: ReloadFixtureApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
schemes:
  ReloadFixture:
    build:
      targets:
        ReloadFixture: all
