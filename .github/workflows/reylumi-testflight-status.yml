name: Reylumi TestFlight Status (read only)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read availability or audit version eligibility
        default: availability
        type: choice
        options: [availability, version-preflight]
      build:
        description: Exact uploaded CFBundleVersion
        required: true
        type: string
      baseline_build:
        description: Previous verified build used by the existing group
        default: '19.1'
        required: true
        type: string
      marketing_version:
        default: '1.0.1'
        required: true
        type: string
      baseline_marketing_version:
        default: '1.0.1'
        required: true
        type: string
      existing_group_id:
        description: Optional exact existing internal group ID
        default: ''
        type: string
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read exact build and existing group availability
        env:
          READ_OPERATION: ${{ inputs.operation }}
          EXPECTED_BUILD: ${{ inputs.build }}
          BASELINE_BUILD: ${{ inputs.baseline_build }}
          BASELINE_MARKETING_VERSION: ${{ inputs.baseline_marketing_version }}
          EXPECTED_MARKETING_VERSION: ${{ inputs.marketing_version }}
          EXISTING_GROUP_ID: ${{ inputs.existing_group_id }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
        run: |
          if [ "$READ_OPERATION" = version-preflight ]; then
            node ios/scripts/release-version-preflight.mjs
          else
            node ios/scripts/check-testflight-availability.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reylumi-availability-${{ github.run_number }}
          path: |
            build/testflight-availability.json
            build/release-version-preflight.json
          if-no-files-found: error
          retention-days: 7

