name: Reylumi iOS Build Check

# Validate the dedicated iOS branch without merging or deploying the website.
on:
  workflow_dispatch:
  push:
    branches: [codex/reylumi-ios-webview]
    paths:
      - 'ios/**'
      - '.github/workflows/reylumi-ios-check.yml'

permissions:
  contents: read

concurrency:
  group: reylumi-ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-and-archive:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate, test and archive
        run: bash scripts/check-build.sh
      - name: Save build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reylumi-ios-check-${{ github.run_number }}
          path: |
            ios/build/build-receipt.json
            ios/build/check.*/SimulatorTests.xcresult
            ios/build/test.log
            ios/build/archive.log
            ios/build/check.*/Reylumi-unsigned.xcarchive
          if-no-files-found: warn
          retention-days: 7
