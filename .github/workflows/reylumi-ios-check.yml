name: Reylumi iOS Build Check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reylumi-ios-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator-and-archive:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Start isolated web regression fixture
        run: |
          mkdir -p build
          python3 -m http.server 8765 --bind 127.0.0.1 --directory ReloadFixtureApp/Fixtures > build/fixture-http.log 2>&1 &
          echo $! > build/fixture-http.pid
      - name: Run iPhone WebKit directly and archive unchanged native app
        timeout-minutes: 12
        run: bash scripts/check-reload-simulator.sh
      - name: Save build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reylumi-ios-direct-${{ github.run_number }}
          path: |
            ios/build/*.json
            ios/build/*.log
            ios/build/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Stop fixture server
        if: always()
        run: |
          if [ -f build/fixture-http.pid ]; then kill "$(cat build/fixture-http.pid)" || true; fi
