name: Reylumi iOS Cookie Lifecycle Diagnostic

# Diagnostic branch only; preserves failed A evidence and does not replace the full release gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reylumi-ios-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cookie-lifecycle-diagnostic:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Rebuild source-bound production bundle (Services pilot OFF)
        working-directory: .
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ vars.NEXT_PUBLIC_MAPTILER_KEY || secrets.NEXT_PUBLIC_MAPTILER_KEY }}
          NEXT_PUBLIC_BOOKING_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_BOOKING_STRIPE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_BOOKING_STRIPE_PUBLISHABLE_KEY }}
          KINGPOS_DISABLE_BACKGROUND_DISPATCH: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: node scripts/ios/local-bundle-release.mjs prepare
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run bounded synthetic cookie A/B diagnostic
        timeout-minutes: 30
        run: bash scripts/diagnose-cookie-lifecycle.sh
      - name: Preserve every diagnostic result including failed A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reylumi-cookie-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ios/build/cookie-lifecycle-diagnostic/*.json
            ios/build/cookie-lifecycle-diagnostic/*.log
            ios/build/cookie-lifecycle-diagnostic/*.txt
            ios/build/cookie-lifecycle-diagnostic/*.plist
            ios/build/cookie-lifecycle-diagnostic/*.xcresult
          if-no-files-found: warn
          retention-days: 7
