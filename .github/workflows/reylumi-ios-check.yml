name: Reylumi iOS Build Check

# Validate the dedicated iOS branch without merging or deploying the website.
on:
  workflow_dispatch:
  push:
    branches: [codex/reylumi-ios-webview]
    paths:
      - 'ios/**'
      - '.github/workflows/reylumi-ios-check.yml'

permissions:
  contents: read

concurrency:
  group: reylumi-ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-and-archive:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Rebuild source-bound production bundle (Services pilot OFF)
        working-directory: .
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPTILER_KEY: ${{ vars.NEXT_PUBLIC_MAPTILER_KEY || secrets.NEXT_PUBLIC_MAPTILER_KEY }}
          NEXT_PUBLIC_BOOKING_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_BOOKING_STRIPE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_BOOKING_STRIPE_PUBLISHABLE_KEY }}
          KINGPOS_DISABLE_BACKGROUND_DISPATCH: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: node scripts/ios/local-bundle-release.mjs prepare
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate, test and archive
        run: bash scripts/check-build.sh
      - name: Save build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reylumi-ios-check-${{ github.run_number }}
          path: |
            ios/build/build-receipt.json
            ios/build/local-bundle-provenance.json
            ios/build/check.*/SimulatorTests.xcresult
            ios/build/test.log
            ios/build/archive.log
            ios/build/check.*/Reylumi-unsigned.xcarchive
          if-no-files-found: warn
          retention-days: 7
