name: Reylumi iOS Build Check

# Validate the dedicated iOS branch without merging or deploying the website.
on:
  workflow_dispatch:
  push:
    branches: [codex/reylumi-ios-webview]
    paths:
      - 'ios/**'
      - '.github/workflows/reylumi-ios-check.yml'

permissions:
  contents: read

concurrency:
  group: reylumi-ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-and-archive:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Start isolated web regression fixture
        run: |
          mkdir -p build
          python3 -m http.server 8765 --bind 127.0.0.1 --directory ReylumiTests/Fixtures > build/fixture-http.log 2>&1 &
          echo $! > build/fixture-http.pid
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/wkwebview-fixture.html') as response:
                      assert response.status == 200
                  break
              except Exception:
                  if attempt == 29: raise
                  time.sleep(0.2)
          PY
      - name: Generate, test and archive
        timeout-minutes: 15
        run: bash scripts/check-build.sh
      - name: Save build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reylumi-ios-check-${{ github.run_number }}
          path: |
            ios/build/build-receipt.json
            ios/build/fixture-http.log
            ios/build/check.*/SimulatorTests.xcresult
            ios/build/test.log
            ios/build/archive.log
            ios/build/check.*/Reylumi-unsigned.xcarchive
          if-no-files-found: warn
          retention-days: 7
      - name: Stop fixture server
        if: always()
        run: |
          if [ -f build/fixture-http.pid ]; then kill "$(cat build/fixture-http.pid)" || true; fi
