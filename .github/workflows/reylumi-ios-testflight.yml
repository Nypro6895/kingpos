name: Reylumi TestFlight
on:
  workflow_dispatch:
  push:
    branches: [codex/reylumi-ios-webview]
    paths:
      - '.github/workflows/reylumi-ios-testflight.yml'
      - 'ios/scripts/testflight.sh'
permissions:
  contents: read
concurrency:
  group: reylumi-testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Sign and upload to TestFlight
        working-directory: ios
        shell: bash
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash scripts/testflight.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reylumi-testflight-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ios/build/testflight-*.log
            ios/build/testflight-receipt.json
          retention-days: 7
