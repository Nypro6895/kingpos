name: POS Persistent Shell CI

on:
  push:
    branches:
      - feature/pos-persistent-shell
  pull_request:
    branches:
      - fix/portable-access-capability-constraint
    paths:
      - 'app/(app)/pos/**'
      - 'app/pos/**'
      - 'tests/pos-persistent-shell-contract.test.mjs'
      - '.github/workflows/pos-persistent-shell-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: POS shell contracts
        run: node --test tests/pos-persistent-shell-contract.test.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
