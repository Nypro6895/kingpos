name: Reylumi Android check
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/reylumi-android-check.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, lint and installable preview
        working-directory: android
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reylumi-android-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
          retention-days: 14
